<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Frostbite War Room</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --ice-white: #eafaff;
      --ice-light: #bcecff;
      --ice-blue: #67cfff;
      --frost-blue: #229ee8;
      --deep-blue: #06121d;
      --abyss: #010305;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      color: var(--ice-white);
      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(
          ellipse at 50% 58%,
          rgba(17, 112, 172, 0.20) 0%,
          rgba(5, 30, 49, 0.14) 30%,
          transparent 58%
        ),
        linear-gradient(
          180deg,
          #08121b 0%,
          #03090e 48%,
          #010305 100%
        );
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background:
        radial-gradient(
          circle at 50% 54%,
          rgba(74, 191, 255, 0.08),
          transparent 34%
        );
    }

    .war-portal {
      position: relative;
      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      isolation: isolate;
    }

    .mist {
      position: absolute;
      width: 900px;
      max-width: 90vw;
      height: 300px;
      top: 49%;
      left: 50%;
      transform: translate(-50%, -50%);

      background:
        radial-gradient(
          ellipse,
          rgba(76, 187, 239, 0.10),
          transparent 65%
        );

      filter: blur(30px);
      pointer-events: none;
      z-index: -2;
    }

    .portal-ring {
      position: absolute;
      width: min(760px, 76vw);
      height: min(570px, 68vh);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -47%);

      border-radius: 50% 50% 10% 10%;

      border:
        1px solid rgba(112, 205, 255, 0.10);

      box-shadow:
        inset 0 0 80px rgba(37, 154, 216, 0.05),
        0 0 70px rgba(37, 154, 216, 0.04);

      z-index: -3;
    }

    .portal-header {
      text-align: center;
      margin-bottom: 34px;
    }

    .motto {
      margin-bottom: 10px;
      color: #7fa4b8;
      font-size: 11px;
      letter-spacing: 0.48em;
      text-transform: uppercase;
    }

    .frostbite-title {
      position: relative;

      font-family:
        Impact,
        "Arial Black",
        sans-serif;

      font-size:
        clamp(58px, 8vw, 118px);

      line-height: 0.88;
      letter-spacing: 0.045em;
      color: #dff7ff;

      text-shadow:
        0 0 4px #ffffff,
        0 0 12px #8bdcff,
        0 0 32px rgba(67, 189, 255, 0.65),
        0 0 70px rgba(21, 133, 198, 0.30);
    }

    .frostbite-title::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: -11px;
      height: 10px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(194, 240, 255, 0.70),
          rgba(80, 191, 244, 0.85),
          rgba(194, 240, 255, 0.70),
          transparent
        );

      filter: blur(6px);
      opacity: 0.45;
    }

    .war-room-label {
      margin-top: 20px;
      color: #53778c;
      font-size: 10px;
      letter-spacing: 0.75em;
      text-transform: uppercase;
    }

    .matchup {
      margin-bottom: 26px;
      text-align: center;
    }

    .ranked-war {
      margin-bottom: 8px;
      color: #58798b;
      font-size: 9px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
    }

    .matchup-name {
      font-size:
        clamp(16px, 2vw, 23px);

      font-weight: 700;
      letter-spacing: 0.22em;
      color: #b7d7e8;
      text-transform: uppercase;
    }

    .matchup-name strong {
      padding: 0 18px;
      color: #70ccfa;
      font-size: 0.8em;
    }

    .countdown-section {
      position: relative;
      width: min(1180px, 94vw);
      text-align: center;
    }

    .war-begins {
      margin-bottom: 19px;
      color: #b2cedc;
      font-size: 12px;
      letter-spacing: 0.55em;
      text-transform: uppercase;
    }

    .countdown {
      position: relative;
      z-index: 5;

      display: flex;
      align-items: flex-start;
      justify-content: center;

      gap:
        clamp(8px, 1.7vw, 25px);
    }

    .time-unit {
      position: relative;

      min-width:
        clamp(72px, 11vw, 145px);

      text-align: center;
    }

    .number-wrap {
      position: relative;
      display: inline-block;
    }

    .number {
      position: relative;
      display: block;

      font-family:
        Impact,
        "Arial Black",
        sans-serif;

      font-size:
        clamp(62px, 9vw, 128px);

      line-height: 0.90;
      letter-spacing: -0.02em;

      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #d7f5ff 18%,
          #9cdefd 42%,
          #4caee0 68%,
          #d9f7ff 100%
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      filter:
        drop-shadow(0 2px 0 #2a6584)
        drop-shadow(0 0 7px rgba(197, 242, 255, 0.95))
        drop-shadow(0 0 18px rgba(61, 183, 242, 0.75))
        drop-shadow(0 0 38px rgba(21, 132, 196, 0.35));

      animation:
        icePulse 3.2s ease-in-out infinite;
    }

    .number::before {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: -5px;
      height: 7px;

      border-radius: 50%;
      background: #c8f1ff;
      filter: blur(4px);
      opacity: 0.35;
    }

    /*
      =====================================================
      CRACK CANVAS
      =====================================================

      Each number gets its own transparent canvas.

      The crack is drawn over the actual frozen digits
      after the zero-charge sequence completes.
    */

    .crack-canvas {
      position: absolute;
      inset: -10% -12%;
      width: 124%;
      height: 120%;

      pointer-events: none;

      z-index: 8;

      opacity: 0;
    }

    .number-wrap.cracked .crack-canvas {
      opacity: 1;
    }

    /*
      =====================================================
      STEP 1 ZERO STATES
      =====================================================
    */

    .countdown.zero-hold .number {
      animation: none;

      filter:
        drop-shadow(0 2px 0 #2a6584)
        drop-shadow(0 0 7px rgba(197, 242, 255, 0.95))
        drop-shadow(0 0 18px rgba(61, 183, 242, 0.75))
        drop-shadow(0 0 38px rgba(21, 132, 196, 0.35));
    }

    .countdown.zero-charge .number {
      animation:
        zeroCharge 2.4s ease-in-out forwards;
    }

    .countdown.zero-charge .separator {
      animation:
        separatorCharge 2.4s ease-in-out forwards;
    }

    /*
      Once the cracking begins we keep the numbers
      at their fully charged brightness.
    */

    .countdown.cracking .number {
      animation: none;

      filter:
        drop-shadow(0 2px 0 #5ba5c8)
        drop-shadow(0 0 18px rgba(255, 255, 255, 1))
        drop-shadow(0 0 45px rgba(140, 225, 255, 1))
        drop-shadow(0 0 95px rgba(46, 181, 247, 0.90))
        drop-shadow(0 0 150px rgba(18, 128, 215, 0.55));
    }

    .countdown.cracking .separator {
      animation: none;
      opacity: 1;

      text-shadow:
        0 0 15px rgba(230, 250, 255, 1),
        0 0 40px rgba(90, 207, 255, 1),
        0 0 80px rgba(34, 161, 231, 0.75);
    }

    .digit-icicle {
      position: absolute;
      z-index: -1;

      width: 0;
      height: 0;

      border-left:
        4px solid transparent;

      border-right:
        4px solid transparent;

      border-top:
        15px solid rgba(130, 213, 249, 0.85);

      filter:
        drop-shadow(
          0 3px 3px rgba(0,0,0,0.8)
        );

      opacity: 0.82;
    }

    .icicle-a {
      left: 26%;
      bottom: -10px;
      transform: rotate(3deg);
      border-top-width: 18px;
    }

    .icicle-b {
      right: 20%;
      bottom: -8px;
      transform: rotate(-4deg);
      border-top-width: 12px;
      opacity: 0.60;
    }

    .time-unit:nth-of-type(3)
    .icicle-a {
      left: 55%;
      border-top-width: 22px;
    }

    .time-unit:nth-of-type(5)
    .icicle-b {
      right: 34%;
      border-top-width: 17px;
    }

    .time-unit:nth-of-type(7)
    .icicle-a {
      left: 18%;
      border-top-width: 14px;
    }

    .time-label {
      display: block;
      margin-top: 24px;
      color: #789aad;
      font-size: 9px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
    }

    .separator {
      margin-top: -2px;
      color: #7ed7ff;

      font-family:
        Impact,
        sans-serif;

      font-size:
        clamp(46px, 6vw, 84px);

      line-height: 1;

      text-shadow:
        0 0 8px rgba(151, 225, 255, 0.9),
        0 0 25px rgba(47, 175, 237, 0.55);

      animation:
        separatorPulse 1.5s ease-in-out infinite;
    }

    .void-space {
      position: relative;
      width: 100%;
      height: 76px;
    }

    .sealed {
      position: relative;
      z-index: 3;
      margin-top: 0;
      color: #42677c;
      font-size: 9px;
      letter-spacing: 0.48em;
      text-transform: uppercase;
    }

    #frostCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
    }

    @keyframes icePulse {

      0%,
      100% {
        filter:
          drop-shadow(0 2px 0 #2a6584)
          drop-shadow(0 0 7px rgba(197, 242, 255, 0.85))
          drop-shadow(0 0 18px rgba(61, 183, 242, 0.62))
          drop-shadow(0 0 38px rgba(21, 132, 196, 0.28));
      }

      50% {
        filter:
          drop-shadow(0 2px 0 #2a6584)
          drop-shadow(0 0 10px rgba(225, 250, 255, 1))
          drop-shadow(0 0 26px rgba(71, 194, 250, 0.82))
          drop-shadow(0 0 50px rgba(21, 132, 196, 0.40));
      }
    }

    @keyframes separatorPulse {

      0%,
      100% {
        opacity: 0.55;
      }

      50% {
        opacity: 1;
      }
    }

    @keyframes zeroCharge {

      0% {
        filter:
          drop-shadow(0 2px 0 #2a6584)
          drop-shadow(0 0 7px rgba(197, 242, 255, 0.95))
          drop-shadow(0 0 18px rgba(61, 183, 242, 0.75))
          drop-shadow(0 0 38px rgba(21, 132, 196, 0.35));
      }

      45% {
        filter:
          drop-shadow(0 2px 0 #3b7d9d)
          drop-shadow(0 0 13px rgba(231, 252, 255, 1))
          drop-shadow(0 0 30px rgba(94, 207, 255, 0.95))
          drop-shadow(0 0 65px rgba(32, 158, 232, 0.62));
      }

      100% {
        filter:
          drop-shadow(0 2px 0 #5ba5c8)
          drop-shadow(0 0 18px rgba(255, 255, 255, 1))
          drop-shadow(0 0 45px rgba(140, 225, 255, 1))
          drop-shadow(0 0 95px rgba(46, 181, 247, 0.90))
          drop-shadow(0 0 150px rgba(18, 128, 215, 0.55));
      }
    }

    @keyframes separatorCharge {

      0% {
        opacity: 0.55;

        text-shadow:
          0 0 8px rgba(151, 225, 255, 0.9),
          0 0 25px rgba(47, 175, 237, 0.55);
      }

      100% {
        opacity: 1;

        text-shadow:
          0 0 15px rgba(230, 250, 255, 1),
          0 0 40px rgba(90, 207, 255, 1),
          0 0 80px rgba(34, 161, 231, 0.75);
      }
    }

    @media (max-width: 700px) {

      .portal-header {
        margin-bottom: 28px;
      }

      .motto {
        font-size: 7px;
        letter-spacing: 0.25em;
      }

      .war-room-label {
        letter-spacing: 0.45em;
      }

      .matchup-name {
        font-size: 13px;
      }

      .matchup-name strong {
        padding: 0 8px;
      }

      .countdown {
        gap: 4px;
      }

      .time-unit {
        min-width: 60px;
      }

      .time-label {
        margin-top: 18px;
        font-size: 6px;
        letter-spacing: 0.18em;
      }

      .war-begins {
        font-size: 9px;
      }

      .digit-icicle {
        border-left-width: 3px;
        border-right-width: 3px;
      }

      .void-space {
        height: 65px;
      }
    }
  </style>
</head>

<body>

  <canvas id="frostCanvas"></canvas>

  <main class="war-portal">

    <div class="mist"></div>

    <div class="portal-ring"></div>

    <header class="portal-header">

      <p class="motto">
        COLD HEARTS • SHARP MINDS • DEADLY FORCE
      </p>

      <h1 class="frostbite-title">
        FROSTBITE
      </h1>

      <p class="war-room-label">
        WAR ROOM
      </p>

    </header>


    <section class="matchup">

      <p class="ranked-war">
        RANKED WAR
      </p>

      <p class="matchup-name">
        FROSTBITE
        <strong>VS</strong>
        W.M.D
      </p>

    </section>


    <section class="countdown-section">

      <p class="war-begins">
        WAR BEGINS IN
      </p>


      <div
        class="countdown"
        id="countdown"
      >

        <div class="time-unit">

          <div class="number-wrap">

            <span
              class="number"
              id="days"
            >
              00
            </span>

            <canvas
              class="crack-canvas"
            ></canvas>

            <span
              class="digit-icicle icicle-a"
            ></span>

          </div>

          <span class="time-label">
            DAYS
          </span>

        </div>


        <span class="separator">
          :
        </span>


        <div class="time-unit">

          <div class="number-wrap">

            <span
              class="number"
              id="hours"
            >
              00
            </span>

            <canvas
              class="crack-canvas"
            ></canvas>

            <span
              class="digit-icicle icicle-a"
            ></span>

            <span
              class="digit-icicle icicle-b"
            ></span>

          </div>

          <span class="time-label">
            HOURS
          </span>

        </div>


        <span class="separator">
          :
        </span>


        <div class="time-unit">

          <div class="number-wrap">

            <span
              class="number"
              id="minutes"
            >
              00
            </span>

            <canvas
              class="crack-canvas"
            ></canvas>

            <span
              class="digit-icicle icicle-b"
            ></span>

          </div>

          <span class="time-label">
            MINUTES
          </span>

        </div>


        <span class="separator">
          :
        </span>


        <div class="time-unit">

          <div class="number-wrap">

            <span
              class="number"
              id="seconds"
            >
              10
            </span>

            <canvas
              class="crack-canvas"
            ></canvas>

            <span
              class="digit-icicle icicle-a"
            ></span>

          </div>

          <span class="time-label">
            SECONDS
          </span>

        </div>

      </div>


      <div class="void-space"></div>


      <p class="sealed">
        THE PORTAL REMAINS SEALED
      </p>

    </section>

  </main>


  <script>

    /*
      =====================================================
      STEP 2 TRANSITION TEST
      =====================================================

      10 seconds
      ↓
      zero
      ↓
      500ms dead stop
      ↓
      2.4 second energy charge
      ↓
      cracks begin forming
      ↓
      fractured zeroes remain on screen
    */

    const TEST_COUNTDOWN_SECONDS = 10;

    const temporaryTarget =
      Date.now() +
      (TEST_COUNTDOWN_SECONDS * 1000);


    const countdownEl =
      document.getElementById("countdown");

    const daysEl =
      document.getElementById("days");

    const hoursEl =
      document.getElementById("hours");

    const minutesEl =
      document.getElementById("minutes");

    const secondsEl =
      document.getElementById("seconds");


    let countdownFinished = false;
    let frostActive = true;


    function pad(value) {

      return String(value)
        .padStart(2, "0");
    }


    function beginZeroSequence() {

      if (countdownFinished) {
        return;
      }


      countdownFinished = true;

      frostActive = false;


      daysEl.textContent = "00";
      hoursEl.textContent = "00";
      minutesEl.textContent = "00";
      secondsEl.textContent = "00";


      countdownEl.classList.add(
        "zero-hold"
      );


      /*
        500ms of total stillness.
      */

      setTimeout(
        () => {

          countdownEl.classList.remove(
            "zero-hold"
          );

          countdownEl.classList.add(
            "zero-charge"
          );


          /*
            zeroCharge lasts 2.4 seconds.

            Once fully charged we begin cracking.
          */

          setTimeout(
            beginCracking,
            2400
          );

        },
        500
      );
    }


    function updateCountdown() {

      if (countdownFinished) {
        return;
      }


      const remaining =
        Math.max(
          0,
          temporaryTarget -
          Date.now()
        );


      const totalSeconds =
        Math.ceil(
          remaining / 1000
        );


      const days =
        Math.floor(
          totalSeconds / 86400
        );


      const hours =
        Math.floor(
          (totalSeconds % 86400) /
          3600
        );


      const minutes =
        Math.floor(
          (totalSeconds % 3600) /
          60
        );


      const seconds =
        totalSeconds % 60;


      daysEl.textContent =
        pad(days);

      hoursEl.textContent =
        pad(hours);

      minutesEl.textContent =
        pad(minutes);

      secondsEl.textContent =
        pad(seconds);


      if (remaining <= 0) {

        beginZeroSequence();
      }
    }


    updateCountdown();


    const countdownInterval =
      setInterval(
        () => {

          updateCountdown();


          if (countdownFinished) {

            clearInterval(
              countdownInterval
            );
          }

        },
        50
      );



    /*
      =====================================================
      CRACK SYSTEM
      =====================================================
    */

    const numberWraps =
      Array.from(
        document.querySelectorAll(
          ".number-wrap"
        )
      );


    function prepareCrackCanvas(
      canvas
    ) {

      const rect =
        canvas.getBoundingClientRect();


      const ratio =
        window.devicePixelRatio || 1;


      canvas.width =
        Math.max(
          1,
          rect.width * ratio
        );


      canvas.height =
        Math.max(
          1,
          rect.height * ratio
        );


      const context =
        canvas.getContext("2d");


      context.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
      );


      return {
        context,
        width: rect.width,
        height: rect.height
      };
    }


    /*
      Creates one branching fracture.

      The crack starts around the middle region of the
      frozen number and grows outward in several branches.
    */

    function createCrackStructure(
      width,
      height
    ) {

      const centerX =
        width *
        (
          0.38 +
          Math.random() *
          0.24
        );


      const centerY =
        height *
        (
          0.32 +
          Math.random() *
          0.30
        );


      const branches = [];


      const branchCount =
        5 +
        Math.floor(
          Math.random() * 3
        );


      for (
        let b = 0;
        b < branchCount;
        b++
      ) {

        const points = [];


        let x = centerX;
        let y = centerY;


        points.push({
          x,
          y
        });


        const baseAngle =
          (
            Math.PI * 2 /
            branchCount
          ) * b +
          (
            Math.random() -
            0.5
          ) * 0.65;


        const segmentCount =
          3 +
          Math.floor(
            Math.random() * 3
          );


        for (
          let s = 0;
          s < segmentCount;
          s++
        ) {

          const distance =
            (
              width * 0.08
            ) +
            Math.random() *
            (
              width * 0.10
            );


          const angle =
            baseAngle +
            (
              Math.random() -
              0.5
            ) * 0.65;


          x +=
            Math.cos(angle) *
            distance;


          y +=
            Math.sin(angle) *
            distance;


          points.push({
            x,
            y
          });
        }


        branches.push(
          points
        );
      }


      return branches;
    }


    function animateCrack(
      wrap,
      delay
    ) {

      setTimeout(
        () => {

          const canvas =
            wrap.querySelector(
              ".crack-canvas"
            );


          const prepared =
            prepareCrackCanvas(
              canvas
            );


          const ctx =
            prepared.context;


          const width =
            prepared.width;


          const height =
            prepared.height;


          const branches =
            createCrackStructure(
              width,
              height
            );


          wrap.classList.add(
            "cracked"
          );


          let progress = 0;


          /*
            Roughly 700ms crack growth.
          */

          const duration = 700;

          const start =
            performance.now();


          function drawFrame(now) {

            progress =
              Math.min(
                1,
                (now - start) /
                duration
              );


            ctx.clearRect(
              0,
              0,
              width,
              height
            );


            branches.forEach(
              points => {

                const segments =
                  points.length - 1;


                const visible =
                  progress *
                  segments;


                ctx.beginPath();


                ctx.moveTo(
                  points[0].x,
                  points[0].y
                );


                for (
                  let i = 0;
                  i < segments;
                  i++
                ) {

                  const amount =
                    Math.max(
                      0,
                      Math.min(
                        1,
                        visible - i
                      )
                    );


                  if (
                    amount <= 0
                  ) {
                    break;
                  }


                  const startPoint =
                    points[i];


                  const endPoint =
                    points[i + 1];


                  const x =
                    startPoint.x +
                    (
                      endPoint.x -
                      startPoint.x
                    ) *
                    amount;


                  const y =
                    startPoint.y +
                    (
                      endPoint.y -
                      startPoint.y
                    ) *
                    amount;


                  ctx.lineTo(
                    x,
                    y
                  );


                  if (
                    amount < 1
                  ) {
                    break;
                  }
                }


                /*
                  Dark fracture core.
                */

                ctx.strokeStyle =
                  "rgba(1, 19, 31, 0.95)";


                ctx.lineWidth = 3;


                ctx.shadowBlur = 0;


                ctx.stroke();


                /*
                  Blue-white energy inside the crack.
                */

                ctx.strokeStyle =
                  "rgba(198, 244, 255, 0.98)";


                ctx.lineWidth = 1;


                ctx.shadowColor =
                  "#55cfff";


                ctx.shadowBlur = 9;


                ctx.stroke();
              }
            );


            if (
              progress < 1
            ) {

              requestAnimationFrame(
                drawFrame
              );
            }
          }


          requestAnimationFrame(
            drawFrame
          );

        },
        delay
      );
    }


    function beginCracking() {

      countdownEl.classList.remove(
        "zero-charge"
      );


      countdownEl.classList.add(
        "cracking"
      );


      /*
        They do not all crack at exactly the same moment.

        This gives us a quick left-to-right chain reaction.
      */

      animateCrack(
        numberWraps[0],
        0
      );


      animateCrack(
        numberWraps[1],
        140
      );


      animateCrack(
        numberWraps[2],
        280
      );


      animateCrack(
        numberWraps[3],
        420
      );
    }



    /*
      =====================================================
      FALLING FROST
      =====================================================
    */

    const frostCanvas =
      document.getElementById(
        "frostCanvas"
      );


    const frostCtx =
      frostCanvas.getContext("2d");


    const particles = [];


    const numberElements = [

      daysEl,
      hoursEl,
      minutesEl,
      secondsEl

    ];


    function resizeFrostCanvas() {

      const ratio =
        window.devicePixelRatio || 1;


      frostCanvas.width =
        window.innerWidth *
        ratio;


      frostCanvas.height =
        window.innerHeight *
        ratio;


      frostCanvas.style.width =
        window.innerWidth +
        "px";


      frostCanvas.style.height =
        window.innerHeight +
        "px";


      frostCtx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
      );
    }


    window.addEventListener(
      "resize",
      resizeFrostCanvas
    );


    resizeFrostCanvas();



    function randomNumberElement() {

      return numberElements[
        Math.floor(
          Math.random() *
          numberElements.length
        )
      ];
    }



    function createFrostParticle() {

      if (!frostActive) {
        return;
      }


      const source =
        randomNumberElement();


      const rect =
        source.getBoundingClientRect();


      const x =
        rect.left +
        rect.width *
        (
          0.08 +
          Math.random() *
          0.84
        );


      const y =
        rect.top +
        rect.height *
        (
          0.70 +
          Math.random() *
          0.25
        );


      const largeChunk =
        Math.random() < 0.10;


      particles.push({

        x,

        y,

        vx:
          (Math.random() - 0.5) *
          (
            largeChunk
              ? 1.5
              : 0.65
          ),

        vy:
          largeChunk
            ? 0.35 +
              Math.random() *
              0.8

            : 0.15 +
              Math.random() *
              0.45,

        gravity:
          largeChunk
            ? 0.045 +
              Math.random() *
              0.025

            : 0.020 +
              Math.random() *
              0.018,

        size:
          largeChunk
            ? 4 +
              Math.random() *
              5

            : 1 +
              Math.random() *
              2.8,

        rotation:
          Math.random() *
          Math.PI,

        rotationSpeed:
          (Math.random() - 0.5) *
          (
            largeChunk
              ? 0.12
              : 0.06
          ),

        alpha:
          0.50 +
          Math.random() *
          0.50,

        large:
          largeChunk

      });
    }



    function drawParticles() {

      frostCtx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
      );


      for (
        let i =
          particles.length - 1;

        i >= 0;

        i--
      ) {

        const p =
          particles[i];


        p.vy +=
          p.gravity;


        p.x +=
          p.vx;


        p.y +=
          p.vy;


        p.rotation +=
          p.rotationSpeed;


        p.alpha -=
          p.large
            ? 0.0011
            : 0.0018;


        frostCtx.save();


        frostCtx.translate(
          p.x,
          p.y
        );


        frostCtx.rotate(
          p.rotation
        );


        frostCtx.globalAlpha =
          Math.max(
            0,
            p.alpha
          );


        frostCtx.fillStyle =
          p.large
            ? "#8fd8f8"
            : "#e8faff";


        frostCtx.shadowColor =
          "#56caff";


        frostCtx.shadowBlur =
          p.large
            ? 12
            : 7;


        frostCtx.beginPath();


        frostCtx.moveTo(
          -p.size * 0.55,
          -p.size * 0.25
        );


        frostCtx.lineTo(
          p.size * 0.10,
          -p.size * 0.55
        );


        frostCtx.lineTo(
          p.size * 0.55,
          -p.size * 0.05
        );


        frostCtx.lineTo(
          p.size * 0.25,
          p.size * 0.55
        );


        frostCtx.lineTo(
          -p.size * 0.45,
          p.size * 0.30
        );


        frostCtx.closePath();


        frostCtx.fill();


        frostCtx.restore();


        if (
          p.y >
            window.innerHeight +
            40 ||

          p.alpha <= 0
        ) {

          particles.splice(
            i,
            1
          );
        }
      }


      requestAnimationFrame(
        drawParticles
      );
    }


    drawParticles();



    function scheduleFrostDrop() {

      if (!frostActive) {
        return;
      }


      createFrostParticle();


      if (
        Math.random() <
        0.28
      ) {

        setTimeout(
          () => {

            if (frostActive) {
              createFrostParticle();
            }

          },
          70 +
          Math.random() *
          120
        );
      }


      if (
        Math.random() <
        0.08
      ) {

        setTimeout(
          () => {

            if (frostActive) {
              createFrostParticle();
            }

          },
          150 +
          Math.random() *
          180
        );
      }


      const nextDrop =
        160 +
        Math.random() *
        440;


      setTimeout(
        scheduleFrostDrop,
        nextDrop
      );
    }


    scheduleFrostDrop();

  </script>

</body>
