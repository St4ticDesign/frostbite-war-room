<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Frostbite War Room</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --ice-white: #eafaff;
      --ice-light: #bcecff;
      --ice-blue: #67cfff;
      --frost-blue: #229ee8;
      --deep-blue: #06121d;
      --abyss: #010305;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      color: var(--ice-white);
      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(
          ellipse at 50% 58%,
          rgba(17, 112, 172, 0.20) 0%,
          rgba(5, 30, 49, 0.14) 30%,
          transparent 58%
        ),
        linear-gradient(
          180deg,
          #08121b 0%,
          #03090e 48%,
          #010305 100%
        );
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background:
        radial-gradient(
          circle at 50% 54%,
          rgba(74, 191, 255, 0.08),
          transparent 34%
        );
    }

    .war-portal {
      position: relative;
      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      isolation: isolate;
    }

    .mist {
      position: absolute;

      width: 900px;
      max-width: 90vw;
      height: 300px;

      top: 49%;
      left: 50%;

      transform: translate(-50%, -50%);

      background:
        radial-gradient(
          ellipse,
          rgba(76, 187, 239, 0.10),
          transparent 65%
        );

      filter: blur(30px);

      pointer-events: none;

      z-index: -2;
    }

    .portal-ring {
      position: absolute;

      width: min(760px, 76vw);
      height: min(570px, 68vh);

      top: 50%;
      left: 50%;

      transform: translate(-50%, -47%);

      border-radius: 50% 50% 10% 10%;

      border:
        1px solid rgba(112, 205, 255, 0.10);

      box-shadow:
        inset 0 0 80px rgba(37, 154, 216, 0.05),
        0 0 70px rgba(37, 154, 216, 0.04);

      z-index: -3;
    }

    .portal-header {
      text-align: center;
      margin-bottom: 34px;
    }

    .motto {
      margin-bottom: 10px;

      color: #7fa4b8;

      font-size: 11px;

      letter-spacing: 0.48em;

      text-transform: uppercase;
    }

    .frostbite-title {
      position: relative;

      font-family:
        Impact,
        "Arial Black",
        sans-serif;

      font-size:
        clamp(58px, 8vw, 118px);

      line-height: 0.88;

      letter-spacing: 0.045em;

      color: #dff7ff;

      text-shadow:
        0 0 4px #ffffff,
        0 0 12px #8bdcff,
        0 0 32px rgba(67, 189, 255, 0.65),
        0 0 70px rgba(21, 133, 198, 0.30);
    }

    .frostbite-title::after {
      content: "";

      position: absolute;

      left: 8%;
      right: 8%;

      bottom: -11px;

      height: 10px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(194, 240, 255, 0.70),
          rgba(80, 191, 244, 0.85),
          rgba(194, 240, 255, 0.70),
          transparent
        );

      filter: blur(6px);

      opacity: 0.45;
    }

    .war-room-label {
      margin-top: 20px;

      color: #53778c;

      font-size: 10px;

      letter-spacing: 0.75em;

      text-transform: uppercase;
    }

    .matchup {
      margin-bottom: 26px;

      text-align: center;
    }

    .ranked-war {
      margin-bottom: 8px;

      color: #58798b;

      font-size: 9px;

      letter-spacing: 0.42em;

      text-transform: uppercase;
    }

    .matchup-name {
      font-size:
        clamp(16px, 2vw, 23px);

      font-weight: 700;

      letter-spacing: 0.22em;

      color: #b7d7e8;

      text-transform: uppercase;
    }

    .matchup-name strong {
      padding: 0 18px;

      color: #70ccfa;

      font-size: 0.8em;
    }

    .countdown-section {
      position: relative;

      width:
        min(1180px, 94vw);

      text-align: center;
    }

    .war-begins {
      margin-bottom: 19px;

      color: #b2cedc;

      font-size: 12px;

      letter-spacing: 0.55em;

      text-transform: uppercase;
    }

    .countdown {
      position: relative;

      z-index: 5;

      display: flex;

      align-items: flex-start;

      justify-content: center;

      gap:
        clamp(8px, 1.7vw, 25px);
    }

    .time-unit {
      position: relative;

      min-width:
        clamp(72px, 11vw, 145px);

      text-align: center;
    }

    .number-wrap {
      position: relative;

      display: inline-block;
    }

    .number {
      position: relative;

      display: block;

      font-family:
        Impact,
        "Arial Black",
        sans-serif;

      font-size:
        clamp(62px, 9vw, 128px);

      line-height: 0.90;

      letter-spacing: -0.02em;

      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #d7f5ff 18%,
          #9cdefd 42%,
          #4caee0 68%,
          #d9f7ff 100%
        );

      -webkit-background-clip: text;

      background-clip: text;

      color: transparent;

      filter:
        drop-shadow(0 2px 0 #2a6584)
        drop-shadow(0 0 7px rgba(197, 242, 255, 0.95))
        drop-shadow(0 0 18px rgba(61, 183, 242, 0.75))
        drop-shadow(0 0 38px rgba(21, 132, 196, 0.35));

      animation:
        icePulse 3.2s ease-in-out infinite;
    }

    .number::before {
      content: "";

      position: absolute;

      left: 12%;
      right: 12%;

      bottom: -5px;

      height: 7px;

      border-radius: 50%;

      background: #c8f1ff;

      filter: blur(4px);

      opacity: 0.35;
    }

    /*
      SMALL ICICLES ATTACHED DIRECTLY
      TO THE COUNTDOWN DIGITS
    */

    .digit-icicle {
      position: absolute;

      z-index: -1;

      width: 0;
      height: 0;

      border-left:
        4px solid transparent;

      border-right:
        4px solid transparent;

      border-top:
        15px solid rgba(130, 213, 249, 0.85);

      filter:
        drop-shadow(
          0 3px 3px rgba(0,0,0,0.8)
        );

      opacity: 0.82;
    }

    .icicle-a {
      left: 26%;
      bottom: -10px;

      transform:
        rotate(3deg);

      border-top-width: 18px;
    }

    .icicle-b {
      right: 20%;
      bottom: -8px;

      transform:
        rotate(-4deg);

      border-top-width: 12px;

      opacity: 0.60;
    }

    .time-unit:nth-of-type(3)
    .icicle-a {
      left: 55%;

      border-top-width: 22px;
    }

    .time-unit:nth-of-type(5)
    .icicle-b {
      right: 34%;

      border-top-width: 17px;
    }

    .time-unit:nth-of-type(7)
    .icicle-a {
      left: 18%;

      border-top-width: 14px;
    }

    .time-label {
      display: block;

      margin-top: 24px;

      color: #789aad;

      font-size: 9px;

      letter-spacing: 0.42em;

      text-transform: uppercase;
    }

    .separator {
      margin-top: -2px;

      color: #7ed7ff;

      font-family:
        Impact,
        sans-serif;

      font-size:
        clamp(46px, 6vw, 84px);

      line-height: 1;

      text-shadow:
        0 0 8px rgba(151, 225, 255, 0.9),
        0 0 25px rgba(47, 175, 237, 0.55);

      animation:
        separatorPulse 1.5s ease-in-out infinite;
    }

    /*
      THERE IS DELIBERATELY NO HORIZONTAL
      ICE SHELF IN THIS VERSION.

      THE NUMBERS NOW FLOAT ABOVE THE ABYSS.
    */

    .void-space {
      position: relative;

      width: 100%;

      height: 76px;
    }

    .sealed {
      position: relative;

      z-index: 3;

      margin-top: 0;

      color: #42677c;

      font-size: 9px;

      letter-spacing: 0.48em;

      text-transform: uppercase;
    }

    .abyss {
      position: absolute;

      left: 50%;

      bottom: -18vh;

      transform:
        translateX(-50%);

      width: 110vw;

      height: 39vh;

      background:
        radial-gradient(
          ellipse at top,
          rgba(13, 72, 105, 0.12),
          transparent 43%
        ),
        linear-gradient(
          transparent,
          rgba(0,0,0,0.95)
        );

      pointer-events: none;

      z-index: -1;
    }

    #frostCanvas {
      position: fixed;

      inset: 0;

      width: 100%;

      height: 100%;

      pointer-events: none;

      z-index: 20;
    }

    @keyframes icePulse {

      0%,
      100% {

        filter:
          drop-shadow(0 2px 0 #2a6584)
          drop-shadow(0 0 7px rgba(197, 242, 255, 0.85))
          drop-shadow(0 0 18px rgba(61, 183, 242, 0.62))
          drop-shadow(0 0 38px rgba(21, 132, 196, 0.28));
      }

      50% {

        filter:
          drop-shadow(0 2px 0 #2a6584)
          drop-shadow(0 0 10px rgba(225, 250, 255, 1))
          drop-shadow(0 0 26px rgba(71, 194, 250, 0.82))
          drop-shadow(0 0 50px rgba(21, 132, 196, 0.40));
      }
    }

    @keyframes separatorPulse {

      0%,
      100% {
        opacity: 0.55;
      }

      50% {
        opacity: 1;
      }
    }

    @media (max-width: 700px) {

      .portal-header {
        margin-bottom: 28px;
      }

      .motto {
        font-size: 7px;

        letter-spacing: 0.25em;
      }

      .war-room-label {
        letter-spacing: 0.45em;
      }

      .matchup-name {
        font-size: 13px;
      }

      .matchup-name strong {
        padding: 0 8px;
      }

      .countdown {
        gap: 4px;
      }

      .time-unit {
        min-width: 60px;
      }

      .time-label {
        margin-top: 18px;

        font-size: 6px;

        letter-spacing: 0.18em;
      }

      .war-begins {
        font-size: 9px;
      }

      .digit-icicle {
        border-left-width: 3px;
        border-right-width: 3px;
      }

      .void-space {
        height: 65px;
      }
    }
  </style>
</head>

<body>

  <canvas id="frostCanvas"></canvas>

  <main class="war-portal">

    <div class="mist"></div>

    <div class="portal-ring"></div>

    <header class="portal-header">

      <p class="motto">
        COLD HEARTS • SHARP MINDS • DEADLY FORCE
      </p>

      <h1 class="frostbite-title">
        FROSTBITE
      </h1>

      <p class="war-room-label">
        WAR ROOM
      </p>

    </header>


    <section class="matchup">

      <p class="ranked-war">
        RANKED WAR
      </p>

      <p class="matchup-name">

        FROSTBITE

        <strong>VS</strong>

        W.M.D

      </p>

    </section>


    <section class="countdown-section">

      <p class="war-begins">
        WAR BEGINS IN
      </p>


      <div
        class="countdown"
        id="countdown"
      >

        <div class="time-unit">

          <div class="number-wrap">

            <span
              class="number"
              id="days"
            >
              03
            </span>

            <span
              class="digit-icicle icicle-a"
            ></span>

          </div>

          <span class="time-label">
            DAYS
          </span>

        </div>


        <span class="separator">
          :
        </span>


        <div class="time-unit">

          <div class="number-wrap">

            <span
              class="number"
              id="hours"
            >
              18
            </span>

            <span
              class="digit-icicle icicle-a"
            ></span>

            <span
              class="digit-icicle icicle-b"
            ></span>

          </div>

          <span class="time-label">
            HOURS
          </span>

        </div>


        <span class="separator">
          :
        </span>


        <div class="time-unit">

          <div class="number-wrap">

            <span
              class="number"
              id="minutes"
            >
              36
            </span>

            <span
              class="digit-icicle icicle-b"
            ></span>

          </div>

          <span class="time-label">
            MINUTES
          </span>

        </div>


        <span class="separator">
          :
        </span>


        <div class="time-unit">

          <div class="number-wrap">

            <span
              class="number"
              id="seconds"
            >
              26
            </span>

            <span
              class="digit-icicle icicle-a"
            ></span>

          </div>

          <span class="time-label">
            SECONDS
          </span>

        </div>

      </div>


      <div class="void-space"></div>


      <p class="sealed">
        THE PORTAL REMAINS SEALED
      </p>

    </section>


    <div class="abyss"></div>

  </main>


  <script>

    /*
      =====================================================
      TEMPORARY VISUAL COUNTDOWN
      =====================================================

      We are still approving the landing page.

      Torn synchronization comes after the visual portal
      has been locked.
    */

    const temporaryTarget =
      Date.now() +
      (3 * 24 * 60 * 60 * 1000) +
      (18 * 60 * 60 * 1000) +
      (36 * 60 * 1000) +
      (26 * 1000);


    const daysEl =
      document.getElementById("days");

    const hoursEl =
      document.getElementById("hours");

    const minutesEl =
      document.getElementById("minutes");

    const secondsEl =
      document.getElementById("seconds");


    function pad(value) {

      return String(value)
        .padStart(2, "0");
    }


    function updateCountdown() {

      const remaining =
        Math.max(
          0,
          temporaryTarget -
          Date.now()
        );


      const totalSeconds =
        Math.floor(
          remaining / 1000
        );


      const days =
        Math.floor(
          totalSeconds / 86400
        );


      const hours =
        Math.floor(
          (totalSeconds % 86400) /
          3600
        );


      const minutes =
        Math.floor(
          (totalSeconds % 3600) /
          60
        );


      const seconds =
        totalSeconds % 60;


      daysEl.textContent =
        pad(days);


      hoursEl.textContent =
        pad(hours);


      minutesEl.textContent =
        pad(minutes);


      secondsEl.textContent =
        pad(seconds);
    }


    updateCountdown();


    setInterval(
      updateCountdown,
      250
    );



    /*
      =====================================================
      FROST PARTICLE SYSTEM
      =====================================================

      Frost now originates DIRECTLY from the countdown
      digits instead of a horizontal shelf.

      Most particles are tiny frost crystals.

      Occasionally a larger chunk of ice breaks loose.
    */


    const canvas =
      document.getElementById(
        "frostCanvas"
      );


    const ctx =
      canvas.getContext("2d");


    const particles = [];


    const numberElements = [

      document.getElementById("days"),

      document.getElementById("hours"),

      document.getElementById("minutes"),

      document.getElementById("seconds")

    ];



    function resizeCanvas() {

      const ratio =
        window.devicePixelRatio || 1;


      canvas.width =
        window.innerWidth *
        ratio;


      canvas.height =
        window.innerHeight *
        ratio;


      canvas.style.width =
        window.innerWidth +
        "px";


      canvas.style.height =
        window.innerHeight +
        "px";


      ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
      );
    }


    window.addEventListener(
      "resize",
      resizeCanvas
    );


    resizeCanvas();



    function randomNumberElement() {

      return numberElements[
        Math.floor(
          Math.random() *
          numberElements.length
        )
      ];
    }



    function createFrostParticle() {

      const source =
        randomNumberElement();


      const rect =
        source.getBoundingClientRect();


      /*
        Particle originates somewhere across the
        lower section of the actual number.
      */

      const x =
        rect.left +
        rect.width *
        (
          0.08 +
          Math.random() *
          0.84
        );


      const y =
        rect.top +
        rect.height *
        (
          0.70 +
          Math.random() *
          0.25
        );


      /*
        Most particles are tiny.

        Roughly 10% become noticeably larger
        fragments.
      */

      const largeChunk =
        Math.random() < 0.10;


      particles.push({

        x: x,

        y: y,

        vx:
          (Math.random() - 0.5) *
          (
            largeChunk
              ? 1.5
              : 0.65
          ),

        vy:
          largeChunk
            ? 0.35 +
              Math.random() *
              0.8

            : 0.15 +
              Math.random() *
              0.45,

        gravity:
          largeChunk
            ? 0.045 +
              Math.random() *
              0.025

            : 0.020 +
              Math.random() *
              0.018,

        size:
          largeChunk
            ? 4 +
              Math.random() *
              5

            : 1 +
              Math.random() *
              2.8,

        rotation:
          Math.random() *
          Math.PI,

        rotationSpeed:
          (Math.random() - 0.5) *
          (
            largeChunk
              ? 0.12
              : 0.06
          ),

        alpha:
          0.50 +
          Math.random() *
          0.50,

        large:
          largeChunk

      });
    }



    function drawParticles() {

      ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
      );


      for (
        let i =
          particles.length - 1;

        i >= 0;

        i--
      ) {

        const p =
          particles[i];


        p.vy +=
          p.gravity;


        p.x +=
          p.vx;


        p.y +=
          p.vy;


        p.rotation +=
          p.rotationSpeed;


        p.alpha -=
          p.large
            ? 0.0011
            : 0.0018;


        ctx.save();


        ctx.translate(
          p.x,
          p.y
        );


        ctx.rotate(
          p.rotation
        );


        ctx.globalAlpha =
          Math.max(
            0,
            p.alpha
          );


        ctx.fillStyle =
          p.large
            ? "#8fd8f8"
            : "#e8faff";


        ctx.shadowColor =
          "#56caff";


        ctx.shadowBlur =
          p.large
            ? 12
            : 7;


        /*
          Slightly irregular ice fragment shape.
        */

        ctx.beginPath();


        ctx.moveTo(
          -p.size * 0.55,
          -p.size * 0.25
        );


        ctx.lineTo(
          p.size * 0.10,
          -p.size * 0.55
        );


        ctx.lineTo(
          p.size * 0.55,
          -p.size * 0.05
        );


        ctx.lineTo(
          p.size * 0.25,
          p.size * 0.55
        );


        ctx.lineTo(
          -p.size * 0.45,
          p.size * 0.30
        );


        ctx.closePath();


        ctx.fill();


        ctx.restore();


        if (
          p.y >
            window.innerHeight +
            40 ||

          p.alpha <= 0
        ) {

          particles.splice(
            i,
            1
          );
        }
      }


      requestAnimationFrame(
        drawParticles
      );
    }


    drawParticles();



    /*
      Particle timing is intentionally irregular.

      We do NOT want a constant waterfall.

      The countdown should look like frost is
      naturally breaking away.
    */


    function scheduleFrostDrop() {

      createFrostParticle();


      /*
        Occasionally several crystals loosen
        together.
      */

      if (
        Math.random() <
        0.28
      ) {

        setTimeout(
          createFrostParticle,
          70 +
          Math.random() *
          120
        );
      }


      if (
        Math.random() <
        0.08
      ) {

        setTimeout(
          createFrostParticle,
          150 +
          Math.random() *
          180
        );
      }


      /*
        Random delay prevents the effect from
        looking mechanically timed.
      */

      const nextDrop =
        160 +
        Math.random() *
        440;


      setTimeout(
        scheduleFrostDrop,
        nextDrop
      );
    }


    scheduleFrostDrop();

  </script>

</body>
</html>
